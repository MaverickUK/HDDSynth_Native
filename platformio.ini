; HDD Synth MK5 firmware (C++ / Arduino-Pico)
;
;   pio run                 build  -> .pio/build/mk5/firmware.uf2
;   pio run -t upload       build + flash over USB (BOOTSEL or auto-reset)
;   pio device monitor      serial console (115200)

[platformio]
default_envs = mk5                    ; plain `pio run` builds and flashes only this

[env:mk5]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2                      ; RP2350A
framework = arduino
board_build.core = earlephilhower
board_upload.maximum_size = 2097152   ; RP2354A: 2 MB in-package flash
board_build.filesystem_size = 0
; How the board names itself over USB while the firmware runs (the IDs stay
; Raspberry Pi's, so uploads keep working). The BOOTSEL drive's "RP2350" name
; comes from the chip's boot ROM and is not affected.
board_build.arduino.earlephilhower.usb_manufacturer = HDD Synth
board_build.arduino.earlephilhower.usb_product = HDDSYNTH
monitor_speed = 115200
; Uploads over USB (debugging) wait up to 1.5 s at boot for the serial
; console; every other build, including GitHub's, doesn't. See the script.
extra_scripts = post:scripts/serial_wait.py
lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.3.0
build_flags =
    -O2
    -Wall
    -DUSE_SD_CRC=1                    ; CRC-check every SD transfer

; Test build: always stream spindown from SD, even when it would fit in RAM,
; to exercise that path (no current sample pack needs it).
;   pio run -e mk5_stream_test -t upload
[env:mk5_stream_test]
extends = env:mk5
build_flags =
    ${env:mk5.build_flags}
    -DFORCE_STREAMED_SPINDOWN=1
